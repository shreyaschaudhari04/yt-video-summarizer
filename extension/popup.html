<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>YT AI Summarizer</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

<div class="app">

    <div class="header">
        <h1>YT AI Summarizer</h1>

        <p>Turn YouTube videos into study-ready content.</p>
    </div>

    <div class="card">

        <div class="field">

            <label>Mode</label>

            <select id="mode">

                <option value="summary">Summary</option>

                <option value="notes">Notes</option>

                <option value="key_takeaways">Key Takeaways</option>

                <option value="exam_prep">Exam Prep</option>

            </select>

        </div>

        <div class="field">

            <label>Output Language</label>

            <select id="language">

                <option value="">Original Language</option>

                <option value="English">English</option>

                <option value="Hindi">Hindi</option>

                <option value="Marathi">Marathi</option>

                <option value="French">French</option>

                <option value="German">German</option>

            </select>

        </div>

        <button id="generateBtn">
            Generate
        </button>

        <div id="loading" class="loading hidden">
            Generating AI content...
        </div>

    </div>

    <div id="result" class="hidden">

        <div class="tabs">

            <button class="tab active" data-tab="summaryTab">
                Summary
            </button>

            <button class="tab" data-tab="originalTab">
                Transcript
            </button>

            <button class="tab" data-tab="translatedTab">
                Translation
            </button>

        </div>

        <div class="content-card">

            <div class="content-actions">

                <button id="copyBtn">
                    Copy
                </button>

                <button id="exportTxtBtn">
                    Export TXT
                </button>

                <button id="exportPdfBtn">
                    Export PDF
                </button>

            </div>

            <div id="summaryTab" class="tab-content active"></div>

            <div id="originalTab" class="tab-content"></div>

            <div id="translatedTab" class="tab-content"></div>

        </div>

    </div>
    <div id="pdfTemplate" class="pdf-template">

    <div class="pdf-header">
        <h1>YT AI Summarizer</h1>

        <p>AI Generated Study Notes</p>
    </div>

    <div class="pdf-meta">

        <div>
            <strong>Mode:</strong>
            <span id="pdfMode"></span>
        </div>

        <div>
            <strong>Language:</strong>
            <span id="pdfLanguage"></span>
        </div>

        <div>
            <strong>Generated:</strong>
            <span id="pdfDate"></span>
        </div>

    </div>

    <div id="pdfContent" class="pdf-content"></div>

    <div class="pdf-footer">
        Generated by YT AI Summarizer
    </div>

</div>

</div>

<script src="popup.js"></script>

<script src="libs/jspdf.umd.min.js"></script>

<script src="libs/html2canvas.min.js"></script>

</body>
</html>
